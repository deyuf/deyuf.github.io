name: Deploy to Cloudflare Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (static export)
        env:
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=deyuf-portfolio --branch="${{ github.ref_name }}"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish deployment links
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_ENVIRONMENT: ${{ steps.deployment.outputs.pages-environment }}
          DEPLOY_URL: ${{ steps.deployment.outputs.deployment-url }}
          DEPLOY_ALIAS_URL: ${{ steps.deployment.outputs.pages-deployment-alias-url }}
        run: |
          {
            printf '### Cloudflare Pages deployment\n\n'
            printf 'Branch: `%s`\n\n' "$DEPLOY_BRANCH"
            printf 'Environment: `%s`\n\n' "$DEPLOY_ENVIRONMENT"
            printf '[Open deployment](%s)\n\n' "$DEPLOY_URL"
            if [ -n "$DEPLOY_ALIAS_URL" ]; then
              printf '[Open branch preview](%s)\n' "$DEPLOY_ALIAS_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
